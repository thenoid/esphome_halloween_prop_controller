[project]
name = "controller-event-collector"
version = "1.0.0"
description = "Passive UDP event archive with REST, browser review and read-only MCP access"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "mcp==1.30.0",
]

[dependency-groups]
dev = ["PyYAML==6.0.3"]

[tool.uv]
package = false
required-version = "==0.13.6"
