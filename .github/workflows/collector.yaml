name: Validate event collector
on:
  push:
    paths:
      - 'event-collector/**'
      - 'packages/controller-events.h'
      - '.github/workflows/collector.yaml'
  pull_request:
    paths:
      - 'event-collector/**'
      - 'packages/controller-events.h'
      - '.github/workflows/collector.yaml'
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: event-collector/.python-version
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: event-collector/uv.lock
      - name: Sync locked collector and test dependencies
        working-directory: event-collector
        run: uv sync --locked
      - name: Protocol, UDP, REST, persistence and MCP tests
        working-directory: event-collector
        run: uv run --locked --no-sync python -m unittest discover -s tests -v
      - name: Validate Compose and skip pulling the build-only service with disposable credentials
        working-directory: event-collector
        run: |
          export COLLECTOR_API_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose.yaml pull collector
      - name: Build container
        run: docker build -t controller-event-collector:test event-collector
      - name: Container UDP ingestion and persistent volume smoke test
        working-directory: event-collector
        run: uv run --locked --no-sync python tests/docker_smoke.py
