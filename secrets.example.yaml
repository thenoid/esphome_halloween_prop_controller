# Copy to secrets.yaml in the same directory as the controller YAML files.
# Replace every REPLACE_ME value before building or flashing.
# Never publish secrets.yaml, generated firmware, logs, or resolved config dumps.
wifi_ssid: "REPLACE_ME_2_4_GHZ_WIFI_SSID"
wifi_password: "REPLACE_ME_WIFI_PASSWORD"

# Required for the native API AND encrypted ESPHome OTA updates.
# Generate your own 32-byte base64 key: openssl rand -base64 32
# This deliberately invalid placeholder prevents accidental use unchanged.
halloween_api_encryption_key: "REPLACE_ME_32_BYTE_BASE64_KEY"

# Fallback captive-portal hotspot password: at least 8 characters, unique.
halloween_ap_password: "REPLACE_ME_UNIQUE_HOTSPOT_PASSWORD"

# Outgoing encrypted API connection target: your Home Assistant server IP.
# Documentation-only address; replace it with your actual target.
# 6054 is Home Assistant's outgoing-connection listener, not the device's 6053.
ha_ip: "192.0.2.1"
ha_api_port: 6054

# Optional: used only if you enable web_server.auth as shown in README.md.
# The preserved upstream behavior is password-free local web access.
halloween_web_username: "REPLACE_ME_WEB_USERNAME"
halloween_web_password: "REPLACE_ME_UNIQUE_WEB_PASSWORD"
